name: build

on:
  push:
    paths-ignore:
      - 'ci.log'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build everything
        shell: bash
        run: |
          rm -f ci.log
          set -o pipefail
          exec > >(tee -a ci.log) 2>&1
          set -x

          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld curl unzip make python3
          clang --version
          if ! command -v ld64.lld >/dev/null; then
            cand=$(ls /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null | head -1)
            [ -n "$cand" ] && sudo ln -sf "$cand" /usr/local/bin/ld64.lld
          fi
          ld64.lld --version

          echo "== restore known-good payload from git history =="
          git show 619f017c564afb428f39323ec465479a14d0efb3:src.b64 > good.b64
          python3 -c "import base64;open('s.tar.gz','wb').write(base64.b64decode(open('good.b64','rb').read()))"
          echo "bb64e1a8b6b445afeab30f7f7b5a3f22a3d67c251bc341f3329df18edd9ae6b6  s.tar.gz" > sha.txt
          sha256sum -c sha.txt
          mkdir -p src && tar xzf s.tar.gz -C src

          echo "== patch sources =="
          python3 - <<'PY'
h='src/tweak/wsgbypass.h'
s=open(h, encoding='utf-8').read()
old = '#else\n  #define WSG_HAVE_C_HOOK 0\n  static inline void wsg_hook_c(void *target, void *repl, void **orig) {\n      (void)target; (void)repl;\n      if (orig) *orig = NULL;\n  }\n#endif'
new = '''#else
  // 运行期 dlsym 找 MSHookFunction（ElleKit / CydiaSubstrate / libhooker 都导出）
  typedef void (*wsg_mshook_fn)(void *, void *, void **);
  static inline wsg_mshook_fn wsg_mshook(void) {
      static wsg_mshook_fn fn = 0;
      static int probed = 0;
      if (!probed) {
          probed = 1;
          fn = (wsg_mshook_fn)dlsym(RTLD_DEFAULT, "MSHookFunction");
          if (!fn) fn = (wsg_mshook_fn)dlsym(RTLD_DEFAULT, "MSHookFunctionEx");
      }
      return fn;
  }
  #define WSG_HAVE_C_HOOK 1
  static inline void wsg_hook_c(void *target, void *repl, void **orig) {
      if (!target) return;
      wsg_mshook_fn f = wsg_mshook();
      if (f) f(target, repl, orig);
      else if (orig) *orig = NULL;
  }
  static inline BOOL wsg_c_hooks_ok(void) { return wsg_mshook() != 0; }
#endif'''
assert old in s, 'header block not found'
open(h,'w', encoding='utf-8').write(s.replace(old, new))
print('header patched')

p='src/tweak/Tweak.xm'
t=open(p, encoding='utf-8').read()
t=t.replace('#import <sys/ptrace.h>',
  '#if __has_include(<sys/ptrace.h>)\n#import <sys/ptrace.h>\n#else\nextern int ptrace(int _req, pid_t _pid, caddr_t _addr, int _data);\n#endif')
old2='#if WSG_HAVE_C_HOOK\n        LOG("C 钩子可用");\n#else\n        LOG("警告：无 substrate/dobby，仅 ObjC 层生效");\n#endif'
assert old2 in t, 'log block not found'
t=t.replace(old2, '        LOG("C hooks: %s", wsg_c_hooks_ok() ? "ON" : "OFF");')
open(p,'w', encoding='utf-8').write(t)
print('tweak patched')
PY

          cat > src/tweak/compat_private.h <<'HDR'
          #pragma once
          #include <CoreFoundation/CoreFoundation.h>
          #include <dlfcn.h>
          #include <stdint.h>

          typedef struct __SecTask *SecTaskRef;
          typedef struct __SecCode *SecCodeRef;
          typedef struct __SecStaticCode *SecStaticCodeRef;
          typedef struct __SecRequirement *SecRequirementRef;
          typedef uint32_t SecCSFlags;

          static inline CFStringRef _wsg_secinfo(const char *n) {
              CFStringRef v = *(CFStringRef *)dlsym(RTLD_DEFAULT, n);
              return v ? v : CFSTR("__missing__");
          }
          #define kSecCodeInfoIdentifier     _wsg_secinfo("kSecCodeInfoIdentifier")
          #define kSecCodeInfoTeamIdentifier _wsg_secinfo("kSecCodeInfoTeamIdentifier")
          #define kSecCodeInfoUnique         _wsg_secinfo("kSecCodeInfoUnique")
          #define kSecCodeInfoFlags          _wsg_secinfo("kSecCodeInfoFlags")
          HDR

          echo "== sdk =="
          curl -sL -o sdk.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          SDKNAME=$(unzip -l sdk.zip | grep -oE 'sdks-master/iPhoneOS[0-9.]+\.sdk' | sort -u -V | tail -1)
          unzip -q sdk.zip "$SDKNAME/*" -d sdkdl
          SDK="$PWD/sdkdl/$SDKNAME"

          echo "== compile arm64 + arm64e =="
          cd src
          mkdir -p build
          COMMON="-isysroot $SDK -F$SDK/System/Library/Frameworks -fuse-ld=lld -fobjc-arc -O2 -Wall -Wno-unused-function -Wno-deprecated-declarations -I tweak -include tweak/compat_private.h -x objective-c -dynamiclib -install_name @loader_path/Frameworks/libwsgbypass.dylib -framework Foundation -framework UIKit -framework Security"
          clang -target arm64-apple-ios13.4.0  $COMMON tweak/Tweak.xm -o build/arm64.dylib
          clang -target arm64e-apple-ios13.4.0 $COMMON tweak/Tweak.xm -o build/arm64e.dylib
          ls -l build

          echo "== fat combine =="
          python3 - <<'PY'
import struct
def build(slices, align=14):
    n=len(slices); hdr=8+n*20
    off=(hdr+(1<<align)-1)&~((1<<align)-1)
    offs=[]; cur=off
    for c,s,d in slices:
        offs.append(cur); cur=(cur+len(d)+(1<<align)-1)&~((1<<align)-1)
    out=bytearray(); out+=struct.pack('>II',0xcafebabe,n)
    for (c,s,d),o in zip(slices,offs):
        out+=struct.pack('>iiIII',c,s,o,len(d),align)
    for (c,s,d),o in zip(slices,offs):
        out+=b'\0'*(o-len(out)); out+=d
    return bytes(out)
a=open('build/arm64.dylib','rb').read()
b=open('build/arm64e.dylib','rb').read()
fat=build([(0x0100000C,0,a),(0x0100000C,-2147483646,b)])
open('build/libwsgbypass.dylib','wb').write(fat)
print('fat size', len(fat), 'arm64', len(a), 'arm64e', len(b))
PY

          echo "== verify =="
          python3 tools/verify_dylib.py build/arm64.dylib
          python3 tools/verify_dylib.py build/arm64e.dylib || true

          echo "== package =="
          python3 tools/build_deb.py --dylib build/libwsgbypass.dylib --rootless --arch iphoneos-arm64e --out dist/arm64e
          mv dist/arm64e/com.yg.wsgbypass_1.0.0_iphoneos-arm64e.deb dist/arm64e/wsgbypass-roothide_1.0.0_iphoneos-arm64e.deb
          python3 tools/build_deb.py --dylib build/libwsgbypass.dylib --rootless --arch iphoneos-arm64 --out dist/arm64
          mv dist/arm64/com.yg.wsgbypass_1.0.0_iphoneos-arm64.deb dist/arm64/wsgbypass-rootless_1.0.0_iphoneos-arm64.deb
          ls -l dist/arm64e dist/arm64
          echo "== DONE =="

      - name: save log
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -f ci.log && git commit -m "ci log" && git push || true

      - name: release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: wsgbypass 1.0.0
          files: |
            src/build/libwsgbypass.dylib
            src/dist/arm64e/*.deb
            src/dist/arm64/*.deb
