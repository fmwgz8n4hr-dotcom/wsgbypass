name: build

on:
  push:
    paths-ignore:
      - 'ci.log'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: build
        shell: bash
        run: |
          rm -f ci.log
          set -o pipefail
          exec > >(tee -a ci.log) 2>&1
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld curl unzip make python3
          if ! command -v ld64.lld >/dev/null; then
            cand=$(ls /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null | head -1)
            [ -n "$cand" ] && sudo ln -sf "$cand" /usr/local/bin/ld64.lld
          fi
          git show 619f017c564afb428f39323ec465479a14d0efb3:src.b64 > good.b64
          python3 -c "import base64;open('s.tar.gz','wb').write(base64.b64decode(open('good.b64','rb').read()))"
          echo "bb64e1a8b6b445afeab30f7f7b5a3f22a3d67c251bc341f3329df18edd9ae6b6  s.tar.gz" > sha.txt
          sha256sum -c sha.txt
          mkdir -p src && tar xzf s.tar.gz -C src
          python3 tools/patch_src.py src
          cp tools/smslog.m src/tweak/smslog.m
          cp tools/devreset.m src/tweak/devreset.m
          cp tools/lcfix.m src/tweak/lcfix.m
          cp tools/dchook.m src/tweak/dchook.m
          curl -sL -o sdk.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          SDKNAME=$(unzip -l sdk.zip | grep -oE 'sdks-master/iPhoneOS[0-9.]+\.sdk' | sort -u -V | tail -1)
          unzip -q sdk.zip "$SDKNAME/*" -d sdkdl
          SDK="$PWD/sdkdl/$SDKNAME"
          cd src
          mkdir -p build dist/arm64
          FLAGS="-isysroot $SDK -F$SDK/System/Library/Frameworks -fuse-ld=lld -fobjc-arc -O2 -Wall -Wno-unused-function -Wno-deprecated-declarations -I tweak -include tweak/compat_private.h -x objective-c -dynamiclib -install_name @loader_path/Frameworks/libwsgbypass.dylib -framework Foundation -framework UIKit -framework Security -framework DeviceCheck"
          SRCS="tweak/Tweak.xm tweak/smslog.m tweak/devreset.m tweak/lcfix.m tweak/dchook.m"
          clang -target arm64-apple-ios13.4.0  $FLAGS $SRCS -o build/arm64.dylib
          clang -target arm64e-apple-ios13.4.0 $FLAGS $SRCS -o build/arm64e.dylib
          python3 ../tools/make_fat.py build/arm64.dylib build/arm64e.dylib build/libwsgbypass.dylib
          cp build/arm64.dylib dist/arm64/libwsgbypass-arm64.dylib
          ls -l build dist/arm64
          python3 tools/verify_dylib.py build/arm64.dylib
          python3 tools/build_deb.py --dylib build/libwsgbypass.dylib --rootless --arch iphoneos-arm64e --out dist/arm64e
          mv dist/arm64e/com.yg.wsgbypass_1.0.0_iphoneos-arm64e.deb dist/arm64e/wsgbypass-roothide_1.0.0_iphoneos-arm64e.deb
          python3 tools/build_deb.py --dylib build/libwsgbypass.dylib --rootless --arch iphoneos-arm64 --out dist/arm64
          mv dist/arm64/com.yg.wsgbypass_1.0.0_iphoneos-arm64.deb dist/arm64/wsgbypass-rootless_1.0.0_iphoneos-arm64.deb
          ls -l dist/arm64e dist/arm64

      - name: save log
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -f ci.log && git commit -m "ci log" && git push || true

      - name: release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: wsgbypass 1.0.0
          files: |
            src/build/libwsgbypass.dylib
            src/dist/arm64/libwsgbypass-arm64.dylib
            src/dist/arm64e/*.deb
            src/dist/arm64/*.deb
