name: build

on:
  push:
    paths-ignore:
      - 'ci.log'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: build everything
        shell: bash
        run: |
          rm -f ci.log
          set -o pipefail
          exec > >(tee -a ci.log) 2>&1
          set -x

          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld curl unzip make python3
          clang --version
          if ! command -v ld64.lld >/dev/null; then
            cand=$(ls /usr/lib/llvm-*/bin/ld64.lld 2>/dev/null | head -1)
            [ -n "$cand" ] && sudo ln -sf "$cand" /usr/local/bin/ld64.lld
          fi
          ld64.lld --version

          echo "== unpack sources =="
          python3 -c "import base64;open('s.tar.gz','wb').write(base64.b64decode(open('src.b64','rb').read()))"
          echo "90651160d0514d39eec0a0e32a611b873a50e0f98e8b0bcf414381f2fdd20c2d  s.tar.gz" > sha.txt
          sha256sum -c sha.txt
          mkdir -p src && tar xzf s.tar.gz -C src

          echo "== compat header =="
          cat > src/tweak/compat_private.h <<'HDR'
          #pragma once
          #include <CoreFoundation/CoreFoundation.h>
          #include <dlfcn.h>
          #include <stdint.h>

          typedef struct __SecTask *SecTaskRef;
          typedef struct __SecCode *SecCodeRef;
          typedef struct __SecStaticCode *SecStaticCodeRef;
          typedef struct __SecRequirement *SecRequirementRef;
          typedef uint32_t SecCSFlags;

          static inline CFStringRef _wsg_secinfo(const char *n) {
              CFStringRef v = *(CFStringRef *)dlsym(RTLD_DEFAULT, n);
              return v ? v : CFSTR("__missing__");
          }
          #define kSecCodeInfoIdentifier     _wsg_secinfo("kSecCodeInfoIdentifier")
          #define kSecCodeInfoTeamIdentifier _wsg_secinfo("kSecCodeInfoTeamIdentifier")
          #define kSecCodeInfoUnique         _wsg_secinfo("kSecCodeInfoUnique")
          #define kSecCodeInfoFlags          _wsg_secinfo("kSecCodeInfoFlags")
          HDR

          echo "== sdk =="
          curl -sL -o sdk.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          SDKNAME=$(unzip -l sdk.zip | grep -oE 'sdks-master/iPhoneOS[0-9.]+\.sdk' | sort -u -V | tail -1)
          unzip -q sdk.zip "$SDKNAME/*" -d sdkdl
          SDK="$PWD/sdkdl/$SDKNAME"

          echo "== compile =="
          cd src
          mkdir -p build
          clang -target arm64-apple-ios13.4.0 \
            -isysroot "$SDK" -F"$SDK/System/Library/Frameworks" \
            -fuse-ld=lld -fobjc-arc -O2 -Wall \
            -Wno-unused-function -Wno-deprecated-declarations \
            -I tweak -include tweak/compat_private.h \
            -x objective-c -dynamiclib \
            -install_name @loader_path/Frameworks/libwsgbypass.dylib \
            tweak/Tweak.xm -o build/libwsgbypass.dylib \
            -framework Foundation -framework UIKit -framework Security
          ls -l build

          echo "== verify =="
          python3 tools/verify_dylib.py build/libwsgbypass.dylib

          echo "== package =="
          python3 tools/build_deb.py --dylib build/libwsgbypass.dylib --rootless --out dist/rootless
          mv dist/rootless/com.yg.wsgbypass_1.0.0_iphoneos-arm64.deb dist/rootless/wsgbypass-rootless_1.0.0_iphoneos-arm64.deb
          python3 tools/build_deb.py --dylib build/libwsgbypass.dylib --out dist/rootful
          mv dist/rootful/com.yg.wsgbypass_1.0.0_iphoneos-arm64.deb dist/rootful/wsgbypass-rootful_1.0.0_iphoneos-arm64.deb
          ls -l dist/rootless dist/rootful
          echo "== DONE =="

      - name: save log
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -f ci.log && git commit -m "ci log" && git push || true

      - name: release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: wsgbypass 1.0.0
          files: |
            src/build/libwsgbypass.dylib
            src/dist/rootless/wsgbypass-rootless_*.deb
            src/dist/rootful/wsgbypass-rootful_*.deb
